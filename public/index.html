<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tablero Kanban</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <h1>Tablero Kanban</h1>
  <div class="header-user">
    <span class="user-label">Usuario: <strong id="user-name">...</strong></span>
    <button class="btn-add" id="btn-new-task">+ Nueva Tarea</button>
    <button class="btn-clear" id="btn-clear-all" title="Eliminar todas">X</button>
    <button class="btn-clear" id="btn-logout" title="Cerrar sesion">Salir</button>
  </div>
</header>

<div class="board">
  <div class="column" data-status="todo">
    <div class="column-header"><h2>Por Hacer</h2><span class="count" id="count-todo">0</span></div>
    <div class="tasks" id="todo" ondragover="Kanban.dragOver(event)" ondragleave="Kanban.dragLeave(event)" ondrop="Kanban.drop(event,'todo')"></div>
  </div>
  <div class="column" data-status="progress">
    <div class="column-header"><h2>En Progreso</h2><span class="count" id="count-progress">0</span></div>
    <div class="tasks" id="progress" ondragover="Kanban.dragOver(event)" ondragleave="Kanban.dragLeave(event)" ondrop="Kanban.drop(event,'progress')"></div>
  </div>
  <div class="column" data-status="done">
    <div class="column-header"><h2>Completado</h2><span class="count" id="count-done">0</span></div>
    <div class="tasks" id="done" ondragover="Kanban.dragOver(event)" ondragleave="Kanban.dragLeave(event)" ondrop="Kanban.drop(event,'done')"></div>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modal-title">Nueva Tarea</h2>
    <form id="task-form">
      <input type="hidden" id="task-id">
      <div class="form-group"><label for="title">Titulo *</label><input type="text" id="title" required></div>
      <div class="form-group"><label for="description">Descripcion</label><textarea id="description"></textarea></div>
      <div class="form-group"><label for="assignee">Responsable</label><input type="text" id="assignee"></div>
      <div class="form-row">
        <div class="form-group"><label for="priority">Prioridad</label>
          <select id="priority"><option value="baja">Baja</option><option value="media" selected>Media</option><option value="alta">Alta</option></select>
        </div>
        <div class="form-group"><label for="status">Estado</label>
          <select id="status"><option value="todo" selected>Por Hacer</option><option value="progress">En Progreso</option><option value="done">Completado</option></select>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="btn-cancel">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login - Kanban</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
body { min-height:100vh; background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); display:flex; align-items:center; justify-content:center; padding:20px; }
.card { background:#fff; border-radius:16px; padding:32px; width:100%; max-width:400px; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
h1 { text-align:center; margin-bottom:8px; color:#2c3e50; }
.subtitle { text-align:center; color:#888; margin-bottom:24px; font-size:.9rem; }
.tabs { display:flex; margin-bottom:20px; border-bottom:2px solid #eee; }
.tab { flex:1; padding:10px; text-align:center; cursor:pointer; font-weight:600; color:#999; border-bottom:3px solid transparent; margin-bottom:-2px; }
.tab.active { color:#764ba2; border-bottom-color:#764ba2; }
.form-group { margin-bottom:14px; }
label { display:block; font-size:.85rem; font-weight:600; margin-bottom:6px; color:#555; }
input { width:100%; padding:10px 12px; border:2px solid #e0e0e0; border-radius:8px; font-size:.95rem; }
input:focus { outline:none; border-color:#764ba2; }
button { width:100%; padding:12px; background:#764ba2; color:#fff; border:none; border-radius:8px; font-weight:600; font-size:1rem; cursor:pointer; margin-top:8px; }
button:hover { opacity:.9; }
.error { background:#fdecea; color:#e74c3c; padding:10px; border-radius:8px; font-size:.85rem; margin-bottom:14px; display:none; }
.error.show { display:block; }
.hidden { display:none; }
</style>
</head>
<body>
<div class="card">
<h1>Kanban</h1>
<p class="subtitle">Sistema de gestion de tareas</p>
<div class="tabs">
<div class="tab active" id="tab-login">Iniciar sesion</div>
<div class="tab" id="tab-register">Registrarse</div>
</div>
<div class="error" id="error-box"></div>
<form id="form-login">
<div class="form-group"><label>Usuario</label><input type="text" id="login-username" required></div>
<div class="form-group"><label>Contrasena</label><input type="password" id="login-password" required></div>
<button type="submit">Entrar</button>
</form>
<form id="form-register" class="hidden">
<div class="form-group"><label>Nombre completo</label><input type="text" id="reg-fullname" required></div>
<div class="form-group"><label>Usuario</label><input type="text" id="reg-username" required minlength="3"></div>
<div class="form-group"><label>Contrasena</label><input type="password" id="reg-password" required minlength="4"></div>
<button type="submit">Crear cuenta</button>
</form>
</div>
<script>
const tabLogin = document.getElementById('tab-login');
const tabRegister = document.getElementById('tab-register');
const formLogin = document.getElementById('form-login');
const formRegister = document.getElementById('form-register');
const errorBox = document.getElementById('error-box');

function showError(msg){ errorBox.textContent=msg; errorBox.classList.add('show'); }
function hideError(){ errorBox.classList.remove('show'); }

tabLogin.onclick=()=>{ tabLogin.classList.add('active'); tabRegister.classList.remove('active'); formLogin.classList.remove('hidden'); formRegister.classList.add('hidden'); hideError(); };
tabRegister.onclick=()=>{ tabRegister.classList.add('active'); tabLogin.classList.remove('active'); formRegister.classList.remove('hidden'); formLogin.classList.add('hidden'); hideError(); };

formLogin.onsubmit = async e=>{
  e.preventDefault(); hideError();
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  try {
    const r = await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const data = await r.json();
    if(!r.ok) throw new Error(data.error || 'Error');
    window.location.href='/index.html';
  } catch(err){ showError(err.message); }
};

formRegister.onsubmit = async e=>{
  e.preventDefault(); hideError();
  const fullname = document.getElementById('reg-fullname').value.trim();
  const username = document.getElementById('reg-username').value.trim();
  const password = document.getElementById('reg-password').value;
  try {
    const r = await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fullname,username,password})});
    const data = await r.json();
    if(!r.ok) throw new Error(data.error || 'Error');
    window.location.href='/index.html';
  } catch(err){ showError(err.message); }
};
</script>
</body>
</html>
